const lessons=[
{id:'basics',title:'Forex foundations',unit:'01',time:'12 min',desc:'Currencies, pairs, pips, lots, leverage and how a trade works.',content:`<h2>Forex foundations</h2><p>Foreign exchange, or forex, is the market where one currency is exchanged for another. Traders compare the relative value of two currencies. It is a decentralised global market, not a guaranteed way to earn money.</p><h3>Currency pairs</h3><p>A pair is written as a base currency followed by a quote currency. In <b>EUR/USD = 1.0850</b>, one euro is quoted as 1.0850 US dollars. If you buy EUR/USD, you are buying euros and selling dollars. If you sell, you are selling euros and buying dollars. Major pairs include EUR/USD, GBP/USD and USD/JPY.</p><div class="example"><b>Worked example:</b> EUR/USD moves from 1.0850 to 1.0870. That is a 0.0020 move, or 20 pips for this non-JPY pair. A pip is usually the fourth decimal place for most pairs. For JPY pairs, it is usually the second decimal place. Some platforms show an extra fractional pip.</div><h3>Lots and trade size</h3><p>A lot describes trade size. A standard lot is 100,000 units of the base currency, a mini lot is 10,000 and a micro lot is 1,000. Broker definitions and contract terms can vary, so check them. Bigger size makes both wins and losses bigger.</p><h3>Leverage and margin</h3><p>Leverage lets a trader control a larger position than the cash set aside as margin. It magnifies exposure, not skill. A small price move can cause a large loss, and some products can lose more than expected due to gaps, fees or broker terms. Rules and protections differ by country.</p><div class="example warning"><b>Example:</b> 1:50 leverage means $100 margin may control up to $5,000 exposure, subject to broker rules. A 1% adverse move on that exposure is $50 before costs, half of the margin. Leverage can rapidly wipe out an account.</div><h3>Bid, ask and spread</h3><p>The bid is the price at which you can sell; the ask is the price at which you can buy. The spread is the difference. Commissions, overnight financing and slippage can add costs. Always know your full costs before any trade.</p>`},
{id:'charts',title:'Charts & candlesticks',unit:'02',time:'14 min',desc:'Timeframes, candle anatomy, price structure and basic chart reading.',content:`<h2>Read a chart without guessing</h2><p>A price chart shows past prices, not the future. A timeframe groups prices into intervals. A 1-hour candle shows price action during one hour; a daily candle covers one day. A short timeframe can look noisy, while a long timeframe hides detail.</p><h3>What one candle says</h3><p>Each candlestick records four prices: open, high, low and close (OHLC). The thick body runs between open and close. Thin wicks show the highest and lowest prices reached during that interval. A rising candle often uses green; a falling candle often uses red, but colours can be configured.</p><div class="example"><b>Worked example:</b> A candle opens at 1.1000, rises to 1.1030, falls to 1.0980, then closes at 1.1020. Its body is 20 pips upward; the upper wick is 10 pips and lower wick 20 pips. It tells you what happened in that hour, not what must happen next.</div><h3>Context before candle names</h3><p>First note the timeframe, recent swing highs/lows and whether price is making higher highs and higher lows, lower highs and lower lows, or moving sideways. A pin bar or engulfing candle is only a description, not a trade signal on its own. Candlestick patterns fail frequently.</p><ul><li>Use a consistent chart scale and timeframe.</li><li>Mark areas, not perfect single-price lines. Price rarely respects an exact line.</li><li>Ask what would disprove your idea before deciding what a pattern means.</li><li>Practice on old or simulated charts without risking money.</li></ul>`},
{id:'entries',title:'When traders buy & sell',unit:'03',time:'18 min',desc:'Support, resistance, trends and example entry ideas with invalidation.',content:`<h2>When might a trader buy or sell?</h2><p>There is no universal moment to buy or sell. A plan may look for a setup, define where the idea is wrong, estimate costs and risk, then wait. Even a carefully defined setup can lose. <b>No strategy guarantees profit.</b> Examples below are for learning chart language, not recommendations.</p><h3>Support and resistance zones</h3><p>Support is an area where falling price previously paused or bounced. Resistance is an area where rising price previously paused or fell. These are zones inferred from past behaviour, not barriers. Price may break through, fake out or react differently next time.</p><h3>Trend and range</h3><p>An uptrend is often described by a sequence of higher highs and higher lows; a downtrend by lower highs and lower lows. A range moves between areas without a clear sequence. Trend definitions vary, so write yours down and test it consistently.</p><h3>Illustrative setup A: pullback in an uptrend</h3><div class="example">Suppose price has made higher highs and higher lows on a chosen timeframe. It pulls back toward a prior swing area. An educational plan might wait for evidence of buyers returning, define an invalidation point below the swing, and calculate a small fixed risk before considering an entry. The pullback can keep falling, the confirmation can fail, and the stop can be slipped.</div><h3>Illustrative setup B: range rejection</h3><div class="example">Suppose price has repeatedly moved between a lower support zone and upper resistance zone. A trader studying a range might watch for rejection near one edge and define a stop beyond the zone. The range may break out instead, so an apparent rejection is not proof. Avoid assuming old boundaries will hold.</div><h3>Illustrative setup C: breakout and retest</h3><div class="example">Price closes beyond a resistance zone, then returns to test it. A learning hypothesis might look for the old resistance to act as support, with a pre-defined invalidation beyond the zone. Breakouts can be false; spreads and slippage can worsen during fast moves.</div><h3>Make a setup testable</h3><ul><li>Write objective conditions for context and entry.</li><li>Write exactly what invalidates the idea, before entering.</li><li>Record the outcome of many historical examples, including fees and losing trades.</li><li>Do not move a stop farther away to avoid accepting a planned loss.</li></ul><p>Practice on a demo simulator first. A demo result does not predict live results.</p>`},
{id:'risk',title:'Risk management',unit:'04',time:'16 min',desc:'Stops, sizing, drawdown, and why beginners often lose money.',content:`<h2>Protect your ability to learn</h2><p>Risk management cannot make a losing idea profitable. It can limit how much one mistake costs. Forex and leveraged CFDs are high risk. Many retail traders lose money; the exact proportion varies by provider, product and period. Never trade borrowed money or money needed for food, rent, school fees or bills.</p><h3>Stop loss</h3><p>A stop-loss order is an instruction to close a position at a chosen level. It may not execute at that exact price in a gap or fast market, and some products/brokers have different protections. A stop is not a guarantee of the maximum loss.</p><h3>Position sizing, step by step</h3><p>1. Pick a small amount you could afford to lose on one idea. 2. Decide where the setup is invalidated. 3. Measure the entry-to-stop distance. 4. Use the broker's contract specifications and pip-value calculator to find a size whose estimated loss fits that amount. Include spread, commission and possible slippage. If the size is too small or unclear, do not take the trade.</p><div class="example"><b>Illustration only:</b> Demo account balance $1,000, hypothetical risk limit 0.5% = $5. If a sample trade's stop is 25 pips away and the pip value at a proposed size is $0.20 per pip, the estimated price loss is 25 × $0.20 = $5 before costs. Actual pip value changes by pair, account currency and size. This is arithmetic practice, not a recommended risk level or trade.</div><h3>Drawdown and losing streaks</h3><p>A 20% loss needs a 25% gain just to return to the starting balance. Losses compound asymmetrically. A string of losses is normal in uncertain markets, so plans should survive it. Set a demo limit and stop practicing when you are emotional.</p><h3>Why many beginners lose</h3><ul><li>Using high leverage or oversized positions.</li><li>Trading without a tested plan, then changing rules after each loss.</li><li>Overtrading, revenge trading, and ignoring spreads or overnight costs.</li><li>Believing guaranteed returns, copying unverified signals, or using borrowed funds.</li><li>Confusing a lucky short-term result with a reliable edge.</li></ul>`},
{id:'safety',title:'Brokers & scam safety',unit:'05',time:'15 min',desc:'Verify permissions, protect your money and avoid signal-selling traps.',content:`<h2>Safety before any account</h2><p>Choosing a broker requires independent checks. This lesson does not endorse a broker. Rules differ across countries and products, and being regulated in one place does not automatically protect a customer in another.</p><h3>How to check a broker</h3><ul><li>Find the exact legal company name, licence number and regulator on the broker's official documents.</li><li>Search that regulator's official register yourself. Match the domain, phone number and legal entity; scammers clone licensed firms.</li><li>Check whether the regulator authorises the exact product and whether it accepts customers in Nigeria.</li><li>Read withdrawal rules, fees, custody and client-money protections. Test a small withdrawal only if you have independently verified the firm, and never send money you cannot afford to lose.</li><li>Use unique passwords and two-factor authentication. Do not share seed phrases, one-time codes or remote access.</li></ul><div class="example warning"><b>Red flags:</b> guaranteed returns, pressure to deposit today, fake celebrity endorsements, requests to pay tax/unlock fees into a personal wallet, referral-chain earnings, unverifiable licences, crypto-only deposits, blocked withdrawals, and support only through a messaging app.</div><h3>Why signal sellers are risky</h3><p>A signal seller may show cherry-picked wins, delete losing calls, fabricate screenshots or earn referral commissions when followers deposit. Past claims are hard to verify and do not guarantee future results. A paid group, copy-trade link or confident voice note is not evidence of a trading edge. Never share broker login details or API access with a signal seller.</p><h3>If you suspect a scam</h3><p>Stop sending money. Save messages, receipts, account names and URLs. Contact your bank/payment provider promptly using a verified channel and report to relevant Nigerian authorities or the regulator for the firm. Do not pay a stranger who promises guaranteed fund recovery.</p>`}

const chartSets=[{label:'Uptrend pullback',truth:'buy',why:'This example shows higher swing areas followed by a pullback near a prior zone. A learner might study whether the uptrend structure remains intact. It is not a live signal and a pullback may deepen.'},{label:'Range at resistance',truth:'sell',why:'This generated example revisits a range ceiling after several swings. A learner might study rejection versus breakout. The same zone can break, so neither direction is certain.'},{label:'Downtrend retest',truth:'sell',why:'Lower highs and lower lows appear in this generated sequence, then price retests a prior area. A learner can study continuation versus reversal. Past shape cannot predict the next candle.'},{label:'Breakout retest',truth:'buy',why:'Price moves above a generated range and returns toward its old ceiling. A learner might study whether it holds as support. False breakouts are common and there is no guaranteed entry.'},{label:'Sideways mid-range',truth:'wait',why:'The sample sits between range boundaries with no clear edge. Waiting is also a valid observation; forcing a trade is not required.'}];
const storeKey='forex-academy-ng-v1';let state={};try{state=JSON.parse(localStorage.getItem(storeKey)||'{}')||{}}catch(e){state={}}state.done=Array.isArray(state.done)?state.done:[];state.best=Number(state.best)||0;state.runs=Number(state.runs)||0;state.sim=Number(state.sim)||0;function save(){try{localStorage.setItem(storeKey,JSON.stringify(state))}catch(e){}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function root(){return document.getElementById('app')}function setPage(p){location.hash=p}function progress(){return Math.round(state.done.length/lessons.length*100)}function home(){return `<section class="hero"><div class="hero-copy"><div class="eyebrow">Free learning. Realistic risks.</div><h1>Understand forex.<br>Practise without pressure.</h1><p class="lead">A clear beginner-to-intermediate course made for Nigerians. Learn the language, read charts, plan risk and spot red flags before you ever think about a real account.</p><div class="actions"><button class="btn" data-go="course">Start the course</button><button class="btn secondary" data-go="simulator">Try the demo simulator</button></div></div><aside class="hero-side"><div><span class="tag">Your learning, on this device</span><h3 style="margin-top:16px">Your progress</h3><div class="statrow"><span>Lessons complete</span><b>${state.done.length} / ${lessons.length}</b></div><div class="progressline"><span style="width:${progress()}%"></span></div><div class="statrow"><span>Best quiz score</span><b>${state.best} / ${quiz.length}</b></div><div class="statrow"><span>Simulator rounds</span><b>${state.sim}</b></div></div><p class="small muted">No account, no fees. Progress stays in this browser on this device.</p></aside></section><div class="notice"><strong>Risk note:</strong> leveraged forex and CFDs are high risk. This app is for education only. It provides no signals, investment advice or promise of profit. The simulator uses generated examples, not live prices.</div><section class="section"><div class="sectionhead"><div><div class="eyebrow">Five guided modules</div><h2>Build your understanding step by step</h2></div><span class="muted small">${progress()}% complete</span></div><div class="grid">${lessons.map((l,i)=>`<article class="lesson-card"><span class="tag">MODULE ${l.unit} · ${l.time}</span><h3>${l.title}</h3><p>${l.desc}</p><button class="btn secondary" data-lesson="${l.id}">${state.done.includes(l.id)?'Review lesson':'Open lesson'}</button></article>`).join('')}</div></section><section class="section"><div class="sectionhead"><div><div class="eyebrow">Practice carefully</div><h2>Quiz, simulator and glossary</h2></div></div><div class="grid"><article class="tool-card"><span class="tag">25 QUESTIONS</span><h3>Knowledge check</h3><p>Test all five modules, see your score and review correct answers.</p><button class="btn secondary" data-go="quiz">Take the quiz</button></article><article class="tool-card"><span class="tag">GENERATED CHARTS</span><h3>Setup spotting lab</h3><p>Choose an observation on illustrative charts. No prices are live.</p><button class="btn secondary" data-go="simulator">Open simulator</button></article><article class="tool-card"><span class="tag">20 TERMS</span><h3>Forex glossary</h3><p>Look up common words in plain language.</p><button class="btn secondary" data-go="glossary">Open glossary</button></article></div></section>`}
let selected=0;function course(){let l=lessons[selected];return `<div class="sectionhead"><div><div class="eyebrow">Beginner to intermediate</div><h2>The learning path</h2><p class="muted">Five modules, with examples and plain-language explanations.</p></div></div><div class="lesson-layout"><aside class="card lesson-list" aria-label="Lessons">${lessons.map((x,i)=>`<button class="${selected===i?'active':''}" data-select-lesson="${i}"><span class="badge">${x.unit}</span> ${x.title}${state.done.includes(x.id)?' ✓':''}</button>`).join('')}</aside><div class="lesson-body"><article class="card"><span class="tag">MODULE ${l.unit} · ${l.time}</span>${l.content}<div class="actions"><button class="btn" data-complete="${l.id}">${state.done.includes(l.id)?'Completed ✓':'Mark lesson complete'}</button>${selected<lessons.length-1?`<button class="btn secondary" data-next="${selected+1}">Next lesson</button>`:''}</div></article><p class="small muted">Lesson ${selected+1} of ${lessons.length}. Completion is saved on this device only.</p></div></div>`}
let answers={};let quizResult=null;function quizPage(){if(quizResult!==null)return `<div class="sectionhead"><div><div class="eyebrow">Knowledge check</div><h2>Your score: ${quizResult} / ${quiz.length}</h2></div></div><div class="result"><b>${Math.round(quizResult/quiz.length*100)}%</b><p>${quizResult>=20?'Strong understanding. Keep practising carefully and remember: knowledge does not remove market risk.':quizResult>=14?'Good start. Review the explanations below and revisit any lesson that felt difficult.':'Use this as a learning check, not a judgement. Revisit the modules and try again when ready.'}</p><p class="muted">Best score saved on this device: ${state.best} / ${quiz.length}</p><button class="btn" data-retry>Try again</button> <button class="btn secondary" data-go="course">Review lessons</button></div>${quiz.map((q,i)=>`<article class="card quiz-q"><p>${i+1}. ${esc(q.q)}</p><p class="${answers[i]===q.a?'':'muted'}">Your answer: ${esc(q.o[answers[i]]??'Not answered')} ${answers[i]===q.a?'✓':'✗'}</p><p class="small">Correct answer: ${esc(q.o[q.a])}</p></article>`).join('')}`;return `<div class="sectionhead"><div><div class="eyebrow">Practice quiz</div><h2>Check what you’ve learned</h2><p class="muted">${quiz.length} questions across all five lessons. Choose one answer each. No trick question can make trading safe.</p></div></div><div class="notice">This is education, not financial advice. A high quiz score is not a forecast of trading results.</div><form id="quizForm">${quiz.map((q,i)=>`<fieldset class="card quiz-q" style="border:1px solid var(--line)"><legend style="padding:0 5px;font-weight:750">${i+1}. ${esc(q.q)}</legend>${q.o.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" ${answers[i]===j?'checked':''}><span>${esc(o)}</span></label>`).join('')}</fieldset>`).join('')}<button class="btn" type="submit">Submit answers</button></form>`}
function candlestickSvg(seed,truth){let rng=seed>>>0;const rand=()=>{rng=(rng*1664525+1013904223)>>>0;return rng/4294967296};let vals=[];let p=52;for(let i=0;i<22;i++){let drift=truth==='buy'?(i<4?1.3:i<11?.3:-.1):truth==='sell'?(i<4?-.9:i<11?-.3:.2):Math.sin(i*.8)*.25;p+=drift+(rand()-.5)*7;vals.push(p)}let min=Math.min(...vals)-7,max=Math.max(...vals)+7, H=210,W=700, y=v=>14+(max-v)/(max-min)*(H-28);let lines='';for(let g=0;g<5;g++){let yy=20+g*41;lines+=`<line x1="35" y1="${yy}" x2="690" y2="${yy}" stroke="#263845"/><text x="3" y="${yy+4}" fill="#82959a" font-size="10">${(max-(yy-14)/196*(max-min)).toFixed(1)}</text>`}let candles=vals.map((v,i)=>{let open=i?vals[i-1]:v-1.3,close=v+(rand()-.5)*4,hi=Math.max(open,close)+rand()*5,lo=Math.min(open,close)-rand()*5,x=48+i*29,col=close>=open?'#72daca':'#ff8b83',top=Math.min(y(open),y(close)),height=Math.max(2,Math.abs(y(open)-y(close)));return `<line x1="${x+7}" y1="${y(hi)}" x2="${x+7}" y2="${y(lo)}" stroke="${col}" stroke-width="2"/><rect x="${x}" y="${top}" width="14" height="${height}" fill="${col}" rx="2"/>`}).join('');return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Generated illustrative candlestick chart">${lines}${candles}<text x="42" y="207" fill="#82959a" font-size="10">Earlier</text><text x="642" y="207" fill="#82959a" font-size="10">Later</text></svg>`}
let simIndex=0,simChoice=null,simRevealed=false;function simulator(){let c=chartSets[simIndex%chartSets.length];return `<div class="sectionhead"><div><div class="eyebrow">No live data · no real trading</div><h2>Setup spotting lab</h2><p class="muted">Generated chart examples help you practise describing what you see. They do not predict real prices.</p></div></div><div class="notice"><strong>Demo only.</strong> Nothing is bought or sold. This chart is randomly generated from a teaching scenario, not a market feed, signal or recommendation.</div><article class="card"><div class="sectionhead"><div><span class="tag">SCENARIO ${simIndex+1}</span><h3 style="margin-top:10px">Observe before deciding</h3></div><span class="badge">Illustrative candles</span></div><div class="chartbox">${candlestickSvg(74621+simIndex*223,c.truth)}</div><p>What would you record about this generated chart?</p><div class="sim-controls">${[['buy','Possible bullish setup'],['sell','Possible bearish setup'],['wait','No clear setup / wait']].map(([v,t])=>`<button class="${simChoice===v?'selected':''}" data-choice="${v}">${t}</button>`).join('')}</div>${simRevealed?`<div class="sim-feedback"><b>Teaching note for “${esc(c.label)}”:</b> ${esc(c.why)}<br><br><b>Your observation:</b> ${simChoice===c.truth?'Matches this scenario’s teaching label. That does not make it a winning trade.':'Different from the scenario label. The label is for discussion, not proof of what price should do.'}</div>`:''}<div class="actions"><button class="btn" data-reveal ${simChoice?'':'disabled'}>${simRevealed?'Show scenario note':'Check teaching note'}</button><button class="btn secondary" data-next-sim>New generated example</button></div></article><p class="small muted">A generated example has a discussion label for learning. In real markets, similar shapes can fail in either direction.</p>`}
function glossary(){return `<div class="sectionhead"><div><div class="eyebrow">Quick reference</div><h2>Forex glossary</h2><p class="muted">Plain-language definitions. Tap a word in your browser’s page search if you’re looking for something specific.</p></div></div><input class="search" id="termSearch" placeholder="Search terms, e.g. pip or margin" aria-label="Search glossary"> <div id="termList">${terms.map(([a,b])=>`<div class="term" data-term="${esc((a+' '+b).toLowerCase())}"><b>${esc(a)}</b><span class="muted">${esc(b)}</span></div>`).join('')}</div><div class="notice">Definitions are general education. Broker contracts and local rules can differ.</div>`}
function render(){let page=(location.hash.slice(1).split('/')[0]||'home');if(!['home','course','quiz','simulator','glossary'].includes(page))page='home';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));root().innerHTML=page==='home'?home():page==='course'?course():page==='quiz'?quizPage():page==='simulator'?simulator():glossary();root().scrollIntoView({block:'start',behavior:'smooth'})}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.go){setPage(b.dataset.go);return}if(b.dataset.lesson){selected=lessons.findIndex(l=>l.id===b.dataset.lesson);setPage('course');return}if(b.dataset.selectLesson!==undefined){selected=Number(b.dataset.selectLesson);render();return}if(b.dataset.next!==undefined){selected=Number(b.dataset.next);render();return}if(b.dataset.complete){if(!state.done.includes(b.dataset.complete))state.done.push(b.dataset.complete);save();render();return}if(b.dataset.choice){simChoice=b.dataset.choice;render();return}if(b.hasAttribute('data-reveal')&&simChoice){if(!simRevealed){simRevealed=true;state.sim++;save()}render();return}if(b.hasAttribute('data-next-sim')){simIndex++;simChoice=null;simRevealed=false;render();return}if(b.hasAttribute('data-retry')){answers={};quizResult=null;render();return}});document.addEventListener('change',e=>{if(e.target.matches('input[type=radio]'))answers[Number(e.target.name.slice(1))]=Number(e.target.value)});document.addEventListener('submit',e=>{if(e.target.id==='quizForm'){e.preventDefault();for(let i=0;i<quiz.length;i++){let el=e.target.elements['q'+i];if(!el.value){alert('Please answer every question before submitting.');return}answers[i]=Number(el.value)}quizResult=quiz.reduce((n,q,i)=>n+(answers[i]===q.a),0);state.runs++;state.best=Math.max(state.best,quizResult);save();render()}});document.addEventListener('input',e=>{if(e.target.id==='termSearch'){let q=e.target.value.toLowerCase();document.querySelectorAll('[data-term]').forEach(x=>x.hidden=!x.dataset.term.includes(q))}});window.addEventListener('hashchange',render);document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));render();
</script></body></html>
