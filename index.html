<script>
const lessons=[
{id:'basics',title:'Forex foundations',unit:'01',time:'12 min',desc:'Learn pairs, pips, lots, prices and leverage from zero.',summary:'Forex compares one currency with another. A pair price tells how much of the second currency buys one unit of the first.',mistake:'Thinking a green number means easy money. Every price can move against you, and leverage can make losses grow fast.',content:`<h2>Forex, from the very beginning</h2><p>Forex is short for <b>foreign exchange</b>. It means changing one country’s money into another, like changing naira to dollars. In the forex market, people compare currencies. The price can go up or down, and nobody can know the next move for sure.</p><h3>Step 1: Read a currency pair</h3><p>A pair has two currencies. In <b>EUR/USD</b>, EUR (the euro) comes first and USD (the US dollar) comes second. The first is the <b>base</b>; the second is the <b>quote</b>. If EUR/USD says 1.10, one euro is being priced at 1.10 US dollars.</p><div class="example"><b>Worked example:</b> Imagine a football sticker costs €1 and the shop says that is $1.10. EUR/USD is 1.10. If the price later says 1.12, the euro is priced higher in dollars. That is only a price change, not a promise about what happens next.</div><h3>Step 2: Buying and selling</h3><p>Buying EUR/USD means buying euros and selling dollars at the same time. Selling EUR/USD means selling euros and buying dollars. Think of the pair as a seesaw: you are comparing the first currency with the second, not buying both separately.</p><h3>Step 3: What is a pip?</h3><p>A <b>pip</b> is a small counting step for a currency price. For most pairs, it is the fourth number after the decimal point. For pairs with the Japanese yen, it is usually the second number. Some apps show one extra tiny fraction.</p><div class="example"><b>Kobo analogy:</b> If one naira has 100 kobo, kobo lets you count a small part of a naira. A pip is a standard small counting step in a forex price. EUR/USD moving from 1.1000 to 1.1010 is 10 pips, because the fourth decimal moved ten steps.</div><h3>Step 4: Size, costs and leverage</h3><p>A <b>lot</b> is a way to describe trade size. A larger size makes each price movement matter more. The <b>spread</b> is the gap between the buy price and sell price, like a small exchange-counter difference. It is a cost to understand.</p><p><b>Leverage</b> lets someone control a bigger position using a smaller amount set aside as margin. It is like using a long seesaw: a small push can make a bigger movement, in either direction. It magnifies losses too. Beginners do not need leverage to learn; use examples or a demo only.</p><div class="example warning"><b>Worked example:</b> A made-up 1:10 leverage example means $10 set aside may control $100 exposure, depending on the provider’s rules. If the price moves against that exposure, the loss can use up the $10 quickly, even before fees. This is classroom arithmetic, not advice to trade.</div>`},
{id:'charts',title:'Charts & candlesticks',unit:'02',time:'14 min',desc:'Understand candles, timeframes and simple price shapes.',summary:'A candle is a picture of four past prices during a chosen time. It describes what happened, not what must happen next.',mistake:'Treating one candle or pattern like a crystal ball. Patterns can fail, so describe them without claiming certainty.',content:`<h2>Read a chart like a story of the past</h2><p>A chart is a picture of prices that already happened. It is not a crystal ball. A <b>timeframe</b> tells how much time each candle covers. A one-hour candle covers one hour; a daily candle covers a day.</p><h3>Step 1: Learn the four candle prices</h3><p>Every candle has an <b>open</b> (where it started), <b>high</b> (highest point), <b>low</b> (lowest point), and <b>close</b> (where it ended). The thick middle part is the body. The thin lines are called wicks.</p><div class="example"><b>Worked example:</b> A candle starts at 1.1000, reaches 1.1030, falls to 1.0980, then ends at 1.1020. The end is above the start, so the body went up 20 pips. Its wick also shows price visited both above and below the body. This only describes that hour.</div><h3>Step 2: Notice the general shape</h3><p>When the price’s high points and low points keep stepping upward, people may describe it as an uptrend. If both keep stepping downward, they may call it a downtrend. If price bounces between two areas, it may be moving sideways or ranging.</p><h3>Step 3: Keep your words careful</h3><p>Support is an area where price previously paused while falling. Resistance is an area where it previously paused while rising. Imagine a ball bouncing near a step: it might bounce again, but it can also roll straight through. These are areas, not walls.</p><ul><li>Say “price went up in this sample,” not “price must go up next.”</li><li>Look at more than one candle, and note the timeframe.</li><li>Practise describing old or generated charts without placing trades.</li></ul>`},
{id:'entries',title:'How buy and sell ideas work',unit:'03',time:'18 min',desc:'Learn what traders mean by a plan, zones and a wrong-way point.',summary:'A trading idea is a question to test, not a prediction. A careful plan says what you are watching and what would prove the idea wrong.',mistake:'Buying or selling just because a candle looks exciting, or copying a stranger’s call without understanding it.',content:`<h2>How people study a possible buy or sell</h2><p>There is no magic moment that is always right. A trader may look at past price, make a written idea, choose what would show the idea is wrong, and consider the costs. The idea can still fail. This lesson explains words, not trades to copy.</p><h3>Step 1: Mark an area, not a magic line</h3><p>Support and resistance are places where price paused before. Picture a bus stop, not a locked gate: a bus may stop there, pass by, or arrive at another time. Price can react to an area or break through it.</p><h3>Step 2: Describe the shape</h3><p>Higher highs and higher lows are a way to describe a rising shape. Lower highs and lower lows describe a falling shape. A range is a back-and-forth shape. These labels describe the past; they do not guarantee the future.</p><h3>Step 3: Ask what would prove your idea wrong</h3><p>Before making any decision, a person can write down the reason for the idea and the point where that reason no longer makes sense. That point is sometimes called <b>invalidation</b>. Knowing you might be wrong is part of learning, not a failure.</p><div class="example"><b>Worked example:</b> On a made-up chart, price has made two higher swing points, then dips toward an earlier area. A learner could write: “I am checking whether the rising shape is still there; if price falls below the last swing, my description needs review.” This is a chart-reading exercise, not a buy instruction. The price could fall further.</div><h3>Step 4: Be patient with uncertainty</h3><p>A breakout can be false. A bounce can turn into a drop. Waiting and taking notes is a valid choice. Do not borrow money, rush because of a group chat, or treat a drawing on a chart as a guarantee.</p>`},
{id:'risk',title:'Risk and protecting yourself',unit:'04',time:'16 min',desc:'Understand losses, position size, stop orders and why demo practice matters.',summary:'Risk is the chance of losing money. Small arithmetic examples help explain it, but they do not make trading safe.',mistake:'Using rent, food, school-fee or borrowed money, or assuming a stop order always exits at the exact price.',content:`<h2>Risk means “what could I lose?”</h2><p>Every market idea can be wrong. <b>Risk management</b> means thinking about possible loss before possible gain. It cannot turn a losing idea into a winning one. Leveraged forex and CFDs are high risk, and some people lose more than they expect.</p><h3>Step 1: Know what a stop order can and cannot do</h3><p>A stop-loss is an instruction intended to close a position at a chosen level. If prices jump quickly, the exit may happen at a different price. Think of it like asking a bus to stop at a spot: traffic or a road closure can change where it actually stops.</p><h3>Step 2: See how position size changes the result</h3><p>Position size means how big the trade is. A bigger size makes each price step count for more money. People study the distance to a possible exit, the size, and the contract rules. The numbers can vary by currency pair, provider and fees.</p><div class="example"><b>Worked example:</b> In a pretend maths exercise, a 25-pip move at $0.20 per pip equals $5 (25 × $0.20). That is before other costs and assumes the quoted pip value stays the same. It is arithmetic only, not a recommended amount or trade.</div><h3>Step 3: Understand a losing streak</h3><p>If a pretend $100 balance falls by 20%, it becomes $80. It then needs to rise by $20, which is 25% of $80, just to return to $100. Losing and recovering are not mirror images.</p><h3>Step 4: Make learning safer</h3><ul><li>Use generated examples or a demo to learn the buttons and vocabulary.</li><li>Never use money needed for food, rent, bills or school.</li><li>Never borrow to trade, and pause when upset or rushed.</li><li>Remember that demo results do not promise real-world results.</li></ul>`},
{id:'safety',title:'Broker checks & scam safety',unit:'05',time:'15 min',desc:'Spot pressure tactics, fake promises and safer ways to verify a company.',summary:'Check the exact company and website in an official register. A logo, screenshot or confident promise is not proof.',mistake:'Trusting a guaranteed-return promise, sending money to a stranger, or paying an extra “unlock” fee to a personal wallet.',content:`<h2>Pause and check before trusting a broker</h2><p>A broker is a company that may provide access to financial products. Rules differ by country and product. A company being regulated somewhere does not automatically mean it is authorised to serve you or that every website using its name is genuine.</p><h3>Step 1: Find the real company name</h3><p>Look for the legal company name and licence details in the company’s own documents. Then open the regulator’s official register yourself. Match the company name, website address and contact details. Scammers can copy a real company’s name and logo.</p><h3>Step 2: Notice pressure and promises</h3><p>“Guaranteed daily profit,” “deposit now or lose your chance,” and “pay a fee to unlock your withdrawal” are serious warning signs. A screenshot of a win does not prove the full history. A stranger asking for your password, one-time code or remote access is not a safe guide.</p><div class="example warning"><b>Worked example:</b> Someone says you must pay ₦50,000 into a personal wallet before they release your withdrawal. Do not rush or send more. Save the messages and receipts, independently check the company, and contact your bank or payment provider through an official number.</div><h3>Step 3: Keep your accounts private</h3><ul><li>Use a unique password and two-step verification.</li><li>Never share a password, one-time code or recovery phrase.</li><li>Do not let a stranger control your phone or computer.</li><li>Ask a trusted adult or qualified professional if a money request feels confusing.</li></ul><p>If you think you were scammed, stop sending money, save evidence and contact your bank or payment provider promptly using a verified channel. Avoid anyone promising guaranteed recovery for another fee.</p>`}
];

['Use demo lessons first','Practise reading charts with generated examples or a demo account. Demo practice teaches the interface, not guaranteed real results.'],
['Write down what you see','Say “this sample made a higher high” instead of “it will rise.” Careful language helps separate facts from guesses.'],
['Check every cost','Spreads, commissions, swaps and slippage can affect results. Read the provider’s terms before using any product.'],
['Take a pause','If you feel angry, scared of missing out, or eager to win back a loss, step away. There is no need to act now.'],
['Keep essential money safe','Do not trade with rent, food, school fees, bill money or borrowed money. Learning can happen without depositing.'],
['Verify the exact website','Check the full web address and legal company in the regulator’s own register. Scammers can copy real company names.'],
['Ignore guaranteed-profit claims','No person can promise reliable forex profits. Pressure, countdowns and “secret signals” are warning signs.'],
['Protect your logins','Never give a broker password, one-time code, recovery phrase or remote access to a stranger.'],
['Keep a learning journal','Write the date, chart timeframe, what you noticed and what confused you. Review mistakes as notes, not as a reason to risk more.']
];

const terms=[['Ask','The price at which a trader can buy a currency pair.'],['Base currency','The first currency in a pair, such as EUR in EUR/USD.'],['Bear / bearish','A view that price may fall. It can still be wrong.'],['Bid','The price at which a trader can sell a currency pair.'],['Bull / bullish','A view that price may rise. It can still be wrong.'],['Candlestick','A chart mark showing open, high, low and close for a period.'],['CFD','A contract for difference. A leveraged derivative with substantial risk; terms and protections vary.'],['Drawdown','A decline from an account’s previous peak.'],['Leverage','Exposure relative to the margin set aside. It increases risk as well as exposure.'],['Lot','A unit of trade size. Confirm the broker’s contract size.'],['Margin','Funds set aside to support leveraged exposure.'],['Pip','A conventional unit of price movement, usually the fourth decimal for most pairs and second for JPY pairs.'],['Resistance','A chart area where rising price previously struggled. Not a guaranteed ceiling.'],['Risk/reward','A comparison of potential loss with potential gain, not a prediction of success.'],['Slippage','Difference between the expected and executed price.'],['Spread','Difference between ask and bid, usually a trading cost.'],['Stop loss','An order intended to close a position at a chosen loss level. Execution can differ.'],['Support','A chart area where falling price previously paused. Not a guaranteed floor.'],['Volatility','How much and how quickly price changes.'],['Quote currency','The second currency in a pair, used to express the base currency’s price.']];
const chartSets=[{label:'Uptrend pullback',truth:'buy',why:'This example shows higher swing areas followed by a pullback near a prior zone. A learner might study whether the uptrend structure remains intact. It is not a live signal and a pullback may deepen.'},{label:'Range at resistance',truth:'sell',why:'This generated example revisits a range ceiling after several swings. A learner might study rejection versus breakout. The same zone can break, so neither direction is certain.'},{label:'Downtrend retest',truth:'sell',why:'Lower highs and lower lows appear in this generated sequence, then price retests a prior area. A learner can study continuation versus reversal. Past shape cannot predict the next candle.'},{label:'Breakout retest',truth:'buy',why:'Price moves above a generated range and returns toward its old ceiling. A learner might study whether it holds as support. False breakouts are common and there is no guaranteed entry.'},{label:'Sideways mid-range',truth:'wait',why:'The sample sits between range boundaries with no clear edge. Waiting is also a valid observation; forcing a trade is not required.'}];
const storeKey='forex-academy-ng-v1';let state={};try{state=JSON.parse(localStorage.getItem(storeKey)||'{}')||{}}catch(e){state={}}state.done=Array.isArray(state.done)?state.done:[];state.best=Number(state.best)||0;state.runs=Number(state.runs)||0;state.sim=Number(state.sim)||0;function save(){try{localStorage.setItem(storeKey,JSON.stringify(state))}catch(e){}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function root(){return document.getElementById('app')}function setPage(p){location.hash=p}function progress(){return Math.round(state.done.length/lessons.length*100)}function home(){return `<section class="hero"><div class="hero-copy"><div class="eyebrow">Free learning. Realistic risks.</div><h1>Understand forex.<br>Practise without pressure.</h1><p class="lead">A friendly course for Nigerians starting from zero. Learn the words, read charts step by step, practise with examples and spot scams. No account or deposit needed.</p><div class="actions"><button class="btn" data-go="course">Start the course</button><button class="btn secondary" data-go="simulator">Try the demo simulator</button><button class="btn secondary" data-go="tips">Beginner tips</button><button class="btn secondary" data-go="tips">Beginner tips</button><button class="btn secondary" data-go="tips">Beginner tips</button><button class="btn secondary" data-go="tips">Beginner tips</button></div></div><aside class="hero-side"><div><span class="tag">Your learning, on this device</span><h3 style="margin-top:16px">Your progress</h3><div class="statrow"><span>Lessons complete</span><b>${state.done.length} / ${lessons.length}</b></div><div class="progressline"><span style="width:${progress()}%"></span></div><div class="statrow"><span>Best quiz score</span><b>${state.best} / ${quiz.length}</b></div><div class="statrow"><span>Simulator rounds</span><b>${state.sim}</b></div></div><p class="small muted">No account, no fees. Progress stays in this browser on this device.</p></aside></section><div class="notice"><strong>Risk note:</strong> leveraged forex and CFDs are high risk. This app is for education only. It provides no signals, investment advice or promise of profit. The simulator uses generated examples, not live prices.</div><section class="section"><div class="sectionhead"><div><div class="eyebrow">Five guided modules</div><h2>Build your understanding step by step</h2></div><span class="muted small">${progress()}% complete</span></div><div class="grid">${lessons.map((l,i)=>`<article class="lesson-card"><span class="tag">MODULE ${l.unit} · ${l.time}</span><h3>${l.title}</h3><p>${l.desc}</p><button class="btn secondary" data-lesson="${l.id}">${state.done.includes(l.id)?'Review lesson':'Open lesson'}</button></article>`).join('')}</div></section><section class="section"><div class="sectionhead"><div><div class="eyebrow">Practice carefully</div><h2>Quiz, simulator and glossary</h2></div></div><div class="grid"><article class="tool-card"><span class="tag">25 QUESTIONS</span><h3>Knowledge check</h3><p>Test all five modules, see your score and review correct answers.</p><button class="btn secondary" data-go="quiz">Take the quiz</button></article><article class="tool-card"><span class="tag">GENERATED CHARTS</span><h3>Setup spotting lab</h3><p>Choose an observation on illustrative charts. No prices are live.</p><button class="btn secondary" data-go="simulator">Open simulator</button></article><article class="tool-card"><span class="tag">20 TERMS</span><h3>Forex glossary</h3><p>Look up common words in plain language.</p><button class="btn secondary" data-go="glossary">Open glossary</button></article></div></section>`}
let selected=0;function course(){let l=lessons[selected];return `<div class="sectionhead"><div><div class="eyebrow">Beginner to intermediate</div><h2>The learning path</h2><p class="muted">Five modules with step-by-step lessons, examples and device-only completion badges.</p></div></div><div class="lesson-layout"><aside class="card lesson-list" aria-label="Lessons">${lessons.map((x,i)=>`<button class="${selected===i?'active':''}" data-select-lesson="${i}"><span class="badge">${x.unit}</span> ${x.title}${state.done.includes(x.id)?' ✓ <span class=\"badge-earned\">Earned</span>':''}</button>`).join('')}</aside><div class="lesson-body"><article class="card"><span class="tag">MODULE ${l.unit} · ${l.time}</span>${l.content}<div class="lesson-summary"><b>Quick recap:</b> ${esc(l.summary)}</div><div class="mistake-box"><b>Beginner mistake to avoid:</b> ${esc(l.mistake)}</div><div class="actions"><button class="btn" data-complete="${l.id}">${state.done.includes(l.id)?'Completed ✓':'Mark lesson complete'}</button>${selected<lessons.length-1?`<button class="btn secondary" data-next="${selected+1}">Next lesson</button>`:''}</div></article><p class="small muted">Lesson ${selected+1} of ${lessons.length}. Completion is saved on this device only.</p></div></div>`}
let answers={};let quizResult=null;function quizPage(){if(quizResult!==null)return `<div class="sectionhead"><div><div class="eyebrow">Knowledge check</div><h2>Your score: ${quizResult} / ${quiz.length}</h2></div></div><div class="result"><b>${Math.round(quizResult/quiz.length*100)}%</b><p>${quizResult>=20?'Strong understanding. Keep practising carefully and remember: knowledge does not remove market risk.':quizResult>=14?'Good start. Review the explanations below and revisit any lesson that felt difficult.':'Use this as a learning check, not a judgement. Revisit the modules and try again when ready.'}</p><p class="muted">Best score saved on this device: ${state.best} / ${quiz.length}</p><button class="btn" data-retry>Try again</button> <button class="btn secondary" data-go="course">Review lessons</button></div>${quiz.map((q,i)=>`<article class="card quiz-q"><p>${i+1}. ${esc(q.q)}</p><p class="${answers[i]===q.a?'':'muted'}">Your answer: ${esc(q.o[answers[i]]??'Not answered')} ${answers[i]===q.a?'✓':'✗'}</p><p class="small">Correct answer: ${esc(q.o[q.a])}</p></article>`).join('')}`;return `<div class="sectionhead"><div><div class="eyebrow">Practice quiz</div><h2>Check what you’ve learned</h2><p class="muted">${quiz.length} questions across all five lessons. Choose one answer each. No trick question can make trading safe.</p></div></div><div class="notice">This is education, not financial advice. A high quiz score is not a forecast of trading results.</div><form id="quizForm">${quiz.map((q,i)=>`<fieldset class="card quiz-q" style="border:1px solid var(--line)"><legend style="padding:0 5px;font-weight:750">${i+1}. ${esc(q.q)}</legend>${q.o.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" ${answers[i]===j?'checked':''}><span>${esc(o)}</span></label>`).join('')}</fieldset>`).join('')}<button class="btn" type="submit">Submit answers</button></form>`}
function candlestickSvg(seed,truth){let rng=seed>>>0;const rand=()=>{rng=(rng*1664525+1013904223)>>>0;return rng/4294967296};let vals=[];let p=52;for(let i=0;i<22;i++){let drift=truth==='buy'?(i<4?1.3:i<11?.3:-.1):truth==='sell'?(i<4?-.9:i<11?-.3:.2):Math.sin(i*.8)*.25;p+=drift+(rand()-.5)*7;vals.push(p)}let min=Math.min(...vals)-7,max=Math.max(...vals)+7, H=210,W=700, y=v=>14+(max-v)/(max-min)*(H-28);let lines='';for(let g=0;g<5;g++){let yy=20+g*41;lines+=`<line x1="35" y1="${yy}" x2="690" y2="${yy}" stroke="#263845"/><text x="3" y="${yy+4}" fill="#82959a" font-size="10">${(max-(yy-14)/196*(max-min)).toFixed(1)}</text>`}let candles=vals.map((v,i)=>{let open=i?vals[i-1]:v-1.3,close=v+(rand()-.5)*4,hi=Math.max(open,close)+rand()*5,lo=Math.min(open,close)-rand()*5,x=48+i*29,col=close>=open?'#72daca':'#ff8b83',top=Math.min(y(open),y(close)),height=Math.max(2,Math.abs(y(open)-y(close)));return `<line x1="${x+7}" y1="${y(hi)}" x2="${x+7}" y2="${y(lo)}" stroke="${col}" stroke-width="2"/><rect x="${x}" y="${top}" width="14" height="${height}" fill="${col}" rx="2"/>`}).join('');return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Generated illustrative candlestick chart">${lines}${candles}<text x="42" y="207" fill="#82959a" font-size="10">Earlier</text><text x="642" y="207" fill="#82959a" font-size="10">Later</text></svg>`}
let simIndex=0,simChoice=null,simRevealed=false;function simulator(){let c=chartSets[simIndex%chartSets.length];return `<div class="sectionhead"><div><div class="eyebrow">No live data · no real trading</div><h2>Setup spotting lab</h2><p class="muted">Generated chart examples help you practise describing what you see. They do not predict real prices.</p></div></div><div class="notice"><strong>Demo only.</strong> Nothing is bought or sold. This chart is randomly generated from a teaching scenario, not a market feed, signal or recommendation.</div><article class="card"><div class="sectionhead"><div><span class="tag">SCENARIO ${simIndex+1}</span><h3 style="margin-top:10px">Observe before deciding</h3></div><span class="badge">Illustrative candles</span></div><div class="chartbox">${candlestickSvg(74621+simIndex*223,c.truth)}</div><p>What would you record about this generated chart?</p><div class="sim-controls">${[['buy','Possible bullish setup'],['sell','Possible bearish setup'],['wait','No clear setup / wait']].map(([v,t])=>`<button class="${simChoice===v?'selected':''}" data-choice="${v}">${t}</button>`).join('')}</div>${simChoice?`<div class="sim-feedback ${simChoice===c.truth?'feedback-correct':'feedback-wrong'}" role="status" aria-live="polite"><b>${simChoice===c.truth?'Correct!':'Not quite.'}</b> ${esc(c.why)}</div>`:''}<div class="actions"><button class="btn secondary" data-next-sim>New generated example</button></div></article><p class="small muted">A generated example has a discussion label for learning. In real markets, similar shapes can fail in either direction.</p>`}

function glossary(){return `<div class="sectionhead"><div><div class="eyebrow">Quick reference</div><h2>Forex glossary</h2><p class="muted">Plain-language definitions. Tap a word in your browser’s page search if you’re looking for something specific.</p></div></div><input class="search" id="termSearch" placeholder="Search terms, e.g. pip or margin" aria-label="Search glossary"> <div id="termList">${terms.map(([a,b])=>`<div class="term" data-term="${esc((a+' '+b).toLowerCase())}"><b>${esc(a)}</b><span class="muted">${esc(b)}</span></div>`).join('')}</div><div class="notice">Definitions are general education. Broker contracts and local rules can differ.</div>`}
function render(){let page=(location.hash.slice(1).split('/')[0]||'home');if(!['home','course','quiz','simulator','glossary','tips'].includes(page))page='home';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));root().innerHTML=page==='home'?home():page==='course'?course():page==='quiz'?quizPage():page==='simulator'?simulator():page==='tips'?tipsPage():glossary();root().scrollIntoView({block:'start',behavior:'smooth'})}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.go){setPage(b.dataset.go);return}if(b.dataset.lesson){selected=lessons.findIndex(l=>l.id===b.dataset.lesson);setPage('course');return}if(b.dataset.selectLesson!==undefined){selected=Number(b.dataset.selectLesson);render();return}if(b.dataset.next!==undefined){selected=Number(b.dataset.next);render();return}if(b.dataset.complete){if(!state.done.includes(b.dataset.complete))state.done.push(b.dataset.complete);save();render();return}if(b.dataset.choice){simChoice=b.dataset.choice;simRevealed=true;state.sim++;save();render();return}if(b.hasAttribute('data-next-sim')){simIndex++;simChoice=null;simRevealed=false;render();return}if(b.hasAttribute('data-retry')){answers={};quizResult=null;render();return}});document.addEventListener('change',e=>{if(e.target.matches('input[type=radio]'))answers[Number(e.target.name.slice(1))]=Number(e.target.value)});document.addEventListener('submit',e=>{if(e.target.id==='quizForm'){e.preventDefault();for(let i=0;i<quiz.length;i++){let el=e.target.elements['q'+i];if(!el.value){alert('Please answer every question before submitting.');return}answers[i]=Number(el.value)}quizResult=quiz.reduce((n,q,i)=>n+(answers[i]===q.a),0);state.runs++;state.best=Math.max(state.best,quizResult);save();render()}});document.addEventListener('input',e=>{if(e.target.id==='termSearch'){let q=e.target.value.toLowerCase();document.querySelectorAll('[data-term]').forEach(x=>x.hidden=!x.dataset.term.includes(q))}});window.addEventListener('hashchange',render);document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));render();
